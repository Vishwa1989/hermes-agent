<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hermes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f5f3;
    color: #1c1c1c;
    display: flex;
    justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16161a; color: #eee; }
    .bubble.assistant { background: #26262c !important; }
    #composer { background: #1c1c22 !important; border-color: #333 !important; }
    input { background: #26262c !important; color: #eee !important; border-color: #3a3a42 !important; }
  }
  main {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    font-weight: 600;
    font-size: 18px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .bubble.user { align-self: flex-end; background: #2f6fed; color: white; }
  .bubble.assistant { align-self: flex-start; background: #eceae6; }
  .bubble.pending { opacity: 0.6; }
  #composer {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid rgba(0,0,0,0.08);
    background: #fff;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
  }
  button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: #2f6fed;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<main>
  <header>Hermes</header>
  <div id="log"></div>
  <form id="composer">
    <input id="input" autocomplete="off" placeholder="Message Hermes…" />
    <button type="submit">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");

  const history = JSON.parse(sessionStorage.getItem("hermes-history") || "[]");
  history.forEach((m) => render(m.role, m.content));

  function render(role, text) {
    const div = document.createElement("div");
    div.className = "bubble " + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    render("user", text);
    history.push({ role: "user", content: text });

    const pending = render("assistant", "…");
    pending.classList.add("pending");
    form.querySelector("button").disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      pending.classList.remove("pending");
      pending.textContent = data.reply || data.error || "No response";
      history.push({ role: "assistant", content: data.reply || "" });
      sessionStorage.setItem("hermes-history", JSON.stringify(history));
    } catch (err) {
      pending.classList.remove("pending");
      pending.textContent = "Something went wrong.";
    } finally {
      form.querySelector("button").disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
